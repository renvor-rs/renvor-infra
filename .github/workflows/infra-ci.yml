# Manifest validation.
#
# This repository had **no CI at all** — a gap `PLAN.md` §26.1 records explicitly ("none — the
# repository has no CI yet"). This closes it for everything that can be checked without touching
# a cluster.
#
# WHAT IS DELIBERATELY NOT HERE: a server-side dry-run against the live API.
#
# That check is genuinely valuable — it is the only one that catches a rejection by a real
# admission controller — but running it from GitHub would require cluster credentials stored as
# a repository secret, and **no long-lived infrastructure credential may exist in GitHub**
# (PLAN.md §26.9). So it is run by the maintainer over SSH before merge, and its output is
# recorded in the pull request. A check that requires a stored kubeconfig is not worth a stored
# kubeconfig.
#
# Every third-party action is pinned to a full commit SHA. A tag is a mutable pointer.

name: infra-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: infra-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  KUBECONFORM_VERSION: v0.7.0
  KUBERNETES_VERSION: '1.35.5'

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: `gitleaks git` scans commits, and a shallow clone would scan a
          # handful of them while reporting a clean result for the repository.
          fetch-depth: 0

      # ── YAML is parseable at all ────────────────────────────────────────────────────
      - name: Parse every YAML document
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys
          try:
              import yaml
          except ImportError:
              sys.exit("PyYAML missing")
          files = sorted(set(glob.glob('**/*.yaml', recursive=True) + glob.glob('**/*.yml', recursive=True)))
          if not files:
              sys.exit("::error::no YAML files found — the glob is wrong, which is not a pass")
          total = 0
          for f in files:
              with open(f) as fh:
                  docs = list(yaml.safe_load_all(fh))
              total += len([d for d in docs if d])
              print(f"  ok  {f}  ({len([d for d in docs if d])} document(s))")
          print(f"parsed {len(files)} file(s), {total} document(s)")
          PY

      # ── Kustomize renders ───────────────────────────────────────────────────────────
      - name: Build every overlay
        run: |
          set -euo pipefail
          mkdir -p rendered
          # `clusters/hostinger/flux-system` is built here too. It is hand-applied rather than
          # reconciled, which is exactly why it needs building in CI: the JSON6902 patch that
          # adds the three controller flags is otherwise never exercised, and a wrong path in it
          # would surface for the first time during a live bootstrap — producing a controller
          # with no `--default-service-account`, which fails open to cluster-admin.
          for o in apps/renvor-site/overlays/staging apps/renvor-site/overlays/production clusters/hostinger clusters/hostinger/flux-system; do
            name="$(echo "$o" | tr '/' '-')"
            echo "── $o"
            kubectl kustomize "$o" > "rendered/${name}.yaml"
            count="$(grep -c '^kind:' "rendered/${name}.yaml")"
            [ "$count" -gt 0 ] || { echo "::error::$o rendered zero resources"; exit 1; }
            echo "   $count resources"
          done

      # ── Schema validation against the real cluster version ──────────────────────────
      - name: Validate against Kubernetes schemas
        run: |
          set -euo pipefail
          curl -sSLo /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          # `-strict` rejects unknown fields — the class of error where a typo'd key is silently
          # ignored and the setting a reviewer thought they were reading never applies.
          # CRDs (Traefik, cert-manager, Flux) are not in the upstream schema set, so their
          # schemas are pulled from the community catalogue rather than skipped: `-ignore-missing-schemas`
          # would turn every CRD typo into a pass.
          for f in rendered/*.yaml; do
            echo "── $f"
            skip=''
            if [ "$f" = 'rendered/clusters-hostinger-flux-system.yaml' ]; then
              # THE ONLY EXEMPTION, AND IT IS NARROW: the `CustomResourceDefinition` *kind*
              # itself, in this one file.
              #
              # kubeconform has no schema for CustomResourceDefinition in the default set, so
              # upstream Flux's seven CRD definitions report "could not find schema" — an
              # availability problem, not a correctness one. Everything else in this file is
              # still validated: on the run that exposed this, 22 of 29 objects passed and the
              # only 7 errors were these.
              #
              # What matters here is the tenancy boundary — the Namespaces, ServiceAccount,
              # Roles and RoleBindings in `renvor-tenancy.yaml` — and those keep full `-strict`
              # coverage. The CRDs are vendored upstream bytes whose provenance is established
              # by a verified signature and a published checksum, not by this step.
              skip='-skip=CustomResourceDefinition'
            fi
            # shellcheck disable=SC2086  # $skip is deliberately word-split: empty means no flag.
            /tmp/kubeconform -strict -summary \
              -kubernetes-version "${KUBERNETES_VERSION}" \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              $skip "$f"
          done

      # ── The tenancy boundary ────────────────────────────────────────────────────────
      - name: Assert the namespace-scoped reconciliation boundary
        run: |
          set -euo pipefail
          # Upstream Flux binds kustomize-controller to cluster-admin. Renvor reconciles a
          # PUBLIC repository onto a cluster shared with unrelated production workloads, so
          # repository-driven applies must run as the restricted `renvor-reconciler` identity
          # instead. That boundary is several independent facts, and the worst of them fails
          # OPEN: drop `serviceAccountName` and reconciliation keeps working, silently, as
          # cluster-admin.
          #
          # The Roles are checked against the resource types the overlays actually render, in
          # both directions — a missing grant breaks the deploy, a surplus grant is authority
          # nobody asked for.
          # The two overlay renders are named explicitly rather than globbed: `rendered/` also
          # holds the rendered control plane, whose GitRepository and Kustomization objects are
          # legitimately the kinds this check forbids *inside an overlay*. Copying them to
          # shorter names would also duplicate every resource for the later duplicate detector.
          python3 scripts/check-tenancy.py \
            rendered/apps-renvor-site-overlays-staging.yaml \
            rendered/apps-renvor-site-overlays-production.yaml

      - name: Prove every tenancy check is live
        run: |
          set -euo pipefail
          # A gate nobody has watched fail is not a gate. This breaks each property in turn, in
          # a throwaway copy of the tree, and fails the build if any tampered tree still passes.
          python3 scripts/check-tenancy-controls.py \
            rendered/apps-renvor-site-overlays-staging.yaml \
            rendered/apps-renvor-site-overlays-production.yaml

      # ── The security properties this repository promises ────────────────────────────
      - name: Assert the workload security invariants
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, yaml

          failures = []
          checked = 0
          for path in sorted(glob.glob('rendered/apps-*.yaml')):
              for doc in yaml.safe_load_all(open(path)):
                  if not doc or doc.get('kind') != 'Deployment':
                      continue
                  checked += 1
                  name = doc['metadata']['name']
                  spec = doc['spec']['template']['spec']
                  pod_sc = spec.get('securityContext', {})

                  def fail(msg):
                      failures.append(f"{path}::{name}: {msg}")

                  if spec.get('automountServiceAccountToken') is not False:
                      fail("automountServiceAccountToken must be false")
                  if spec.get('serviceAccountName') in (None, 'default'):
                      fail("must use a dedicated ServiceAccount, not `default`")
                  for host in ('hostNetwork', 'hostPID', 'hostIPC'):
                      if spec.get(host):
                          fail(f"{host} must not be enabled")
                  if spec.get('volumes'):
                      fail("declares volumes; this workload stores nothing")
                  if pod_sc.get('runAsNonRoot') is not True:
                      fail("pod securityContext.runAsNonRoot must be true")

                  for c in spec['containers']:
                      sc = c.get('securityContext', {})
                      img = c['image']
                      if '@sha256:' not in img:
                          fail(f"image {img!r} is not pinned by digest")
                      if 'PLACEHOLDER' in img:
                          fail(f"image {img!r} still contains a placeholder digest")
                      if sc.get('allowPrivilegeEscalation') is not False:
                          fail("allowPrivilegeEscalation must be false")
                      if sc.get('readOnlyRootFilesystem') is not True:
                          fail("readOnlyRootFilesystem must be true")
                      if sc.get('runAsNonRoot') is not True:
                          fail("container runAsNonRoot must be true")
                      if sc.get('capabilities', {}).get('drop') != ['ALL']:
                          fail("must drop ALL capabilities")
                      if sc.get('seccompProfile', {}).get('type') != 'RuntimeDefault':
                          fail("seccompProfile must be RuntimeDefault")
                      res = c.get('resources', {})
                      for side in ('requests', 'limits'):
                          for key in ('cpu', 'memory', 'ephemeral-storage'):
                              if key not in res.get(side, {}):
                                  fail(f"resources.{side}.{key} is missing")
                      for probe in ('startupProbe', 'readinessProbe', 'livenessProbe'):
                          if probe not in c:
                              fail(f"{probe} is missing")

          if checked == 0:
              sys.exit("::error::no Deployment was checked — the glob matched nothing, which is not a pass")
          print(f"checked {checked} Deployment(s)")
          if failures:
              for f in failures:
                  print(f"::error::{f}")
              sys.exit(1)
          print("every workload security invariant holds")
          PY

      # ── NetworkPolicy: the AND/OR mistake, specifically ─────────────────────────────
      - name: Assert the namespace default-denies and the Traefik rule is not over-broad
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, yaml

          failures, seen = [], 0
          for path in sorted(glob.glob('rendered/apps-*.yaml')):
              policies = [d for d in yaml.safe_load_all(open(path)) if d and d.get('kind') == 'NetworkPolicy']
              names = {p['metadata']['name'] for p in policies}
              if 'renvor-site-default-deny' not in names:
                  failures.append(f"{path}: no default-deny NetworkPolicy")
              for p in policies:
                  seen += 1
                  name = p['metadata']['name']
                  spec = p['spec']
                  if name.endswith('default-deny'):
                      if sorted(spec.get('policyTypes', [])) != ['Egress', 'Ingress']:
                          failures.append(f"{path}::{name}: must deny both Ingress and Egress")
                      if spec.get('ingress') or spec.get('egress'):
                          failures.append(f"{path}::{name}: a default-deny policy must carry no rules")
                  if name.endswith('allow-traefik'):
                      if spec.get('egress'):
                          failures.append(f"{path}::{name}: must not open egress")
                      for rule in spec.get('ingress', []):
                          for src in rule.get('from', []):
                              # THE CHECK THAT MATTERS. Two selectors in ONE `from` element are
                              # ANDed; split across two elements they are ORed, which permits any
                              # pod in kube-system AND any traefik-labelled pod anywhere. The two
                              # look nearly identical in review and differ enormously in effect.
                              if set(src) != {'namespaceSelector', 'podSelector'}:
                                  failures.append(
                                      f"{path}::{name}: each `from` element must AND a namespaceSelector "
                                      f"with a podSelector; found {sorted(src)}")
          if seen == 0:
              sys.exit("::error::no NetworkPolicy was checked — that is not a pass")
          print(f"checked {seen} NetworkPolicy object(s)")
          if failures:
              for f in failures:
                  print(f"::error::{f}")
              sys.exit(1)
          print("network policy invariants hold")
          PY

      # ── Duplicate resources ─────────────────────────────────────────────────────────
      - name: Detect duplicate resources
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, yaml
          from collections import Counter
          bad = False
          for path in sorted(glob.glob('rendered/*.yaml')):
              keys = []
              for d in yaml.safe_load_all(open(path)):
                  if not d: continue
                  m = d.get('metadata', {})
                  keys.append((d.get('apiVersion'), d.get('kind'), m.get('namespace', ''), m.get('name')))
              dupes = [k for k, n in Counter(keys).items() if n > 1]
              if dupes:
                  bad = True
                  for k in dupes:
                      print(f"::error::{path}: duplicate resource {k}")
              print(f"  {path}: {len(keys)} resources, {len(dupes)} duplicates")
          sys.exit(1 if bad else 0)
          PY

      # ── Nothing may reach outside Renvor's own namespaces ───────────────────────────
      - name: Assert the blast radius
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, yaml

          # THE RULE DEPENDS ON WHO APPLIES THE FILE, so the three scopes are judged separately.
          #
          # A previous version applied one rule to everything and contained a dead condition:
          # `kind in (..., 'Namespace') and kind != 'Namespace'` can never fire, so Namespaces
          # were silently exempt from the cluster-scoped check they appeared to be covered by.
          # It also omitted Node, CustomResourceDefinition, PersistentVolume and StorageClass
          # entirely.
          CLUSTER_SCOPED = {
              'ClusterRole', 'ClusterRoleBinding', 'ClusterIssuer', 'Namespace', 'Node',
              'CustomResourceDefinition', 'PersistentVolume', 'StorageClass',
              'ValidatingWebhookConfiguration', 'MutatingWebhookConfiguration',
              'APIService', 'PriorityClass', 'IngressClass', 'RuntimeClass',
          }
          RENVOR_NS = {'renvor-site', 'renvor-site-staging'}

          # What the hand-applied bootstrap is allowed to create, exactly. Upstream Flux
          # legitimately ships cluster-scoped objects; the point is that the inventory is fixed
          # and reviewed, so a new one arriving is visible rather than assumed fine.
          BOOTSTRAP_EXPECTED = {
              'CustomResourceDefinition': 7, 'ClusterRole': 3, 'ClusterRoleBinding': 2,
              'Namespace': 3, 'ServiceAccount': 3, 'Deployment': 2, 'Service': 1,
              'NetworkPolicy': 3, 'ResourceQuota': 1, 'Role': 2, 'RoleBinding': 2,
          }

          bad, counted = [], 0
          for path in sorted(glob.glob('rendered/*.yaml')):
              docs = [d for d in yaml.safe_load_all(open(path)) if d]
              counted += len(docs)
              if path.startswith('rendered/apps-'):
                  # RECONCILED FROM A PUBLIC REPOSITORY. Nothing cluster-scoped, nothing outside
                  # the two Renvor namespaces. The reconciler has no authority for either, so
                  # this duplicates RBAC on purpose — it fails in review rather than at apply.
                  for d in docs:
                      kind = d.get('kind'); name = d.get('metadata', {}).get('name')
                      ns = d.get('metadata', {}).get('namespace', '')
                      if kind in CLUSTER_SCOPED:
                          bad.append(f"{path}: cluster-scoped {kind}/{name} in a reconciled overlay")
                      if ns and ns not in RENVOR_NS:
                          bad.append(f"{path}: {kind}/{name} targets namespace {ns!r}")
              elif path == 'rendered/clusters-hostinger.yaml':
                  # THE CONTROL PLANE, hand-applied: only Flux control objects, only in flux-system.
                  for d in docs:
                      kind = d.get('kind'); name = d.get('metadata', {}).get('name')
                      ns = d.get('metadata', {}).get('namespace', '')
                      if kind not in ('GitRepository', 'Kustomization'):
                          bad.append(f"{path}: unexpected {kind}/{name} in the control plane")
                      if ns != 'flux-system':
                          bad.append(f"{path}: {kind}/{name} is in namespace {ns!r}, not flux-system")
              elif path == 'rendered/clusters-hostinger-flux-system.yaml':
                  # THE BOOTSTRAP, hand-applied: cluster-scoped objects allowed, inventory fixed.
                  seen = {}
                  for d in docs:
                      kind = d.get('kind'); name = d.get('metadata', {}).get('name')
                      ns = d.get('metadata', {}).get('namespace', '')
                      seen[kind] = seen.get(kind, 0) + 1
                      if ns and ns not in (RENVOR_NS | {'flux-system'}):
                          bad.append(f"{path}: {kind}/{name} targets namespace {ns!r}")
                  if seen != BOOTSTRAP_EXPECTED:
                      for k in sorted(set(seen) | set(BOOTSTRAP_EXPECTED)):
                          if seen.get(k, 0) != BOOTSTRAP_EXPECTED.get(k, 0):
                              bad.append(f"{path}: {k} count is {seen.get(k, 0)}, "
                                         f"expected {BOOTSTRAP_EXPECTED.get(k, 0)}")
              else:
                  bad.append(f"{path}: unclassified render — add it to the blast-radius rules")

          if not counted:
              sys.exit("no rendered objects were inspected; this check would pass vacuously")
          if bad:
              for b in bad: print(f"::error::{b}")
              sys.exit(1)
          print(f"{counted} objects: reconciled overlays are namespaced and Renvor-only; "
                f"the hand-applied bootstrap matches its reviewed inventory")
          PY

      # ── Secrets ─────────────────────────────────────────────────────────────────────
      # The binary from a pinned release with a verified checksum, matching how the framework
      # repository does it. An unverified download in the job that performs secret scanning
      # would undermine the very check it exists to run — and the action variant additionally
      # gates on an organisation licence key, which is a dependency this repository does not
      # need to acquire.
      - name: Install gitleaks 8.30.1
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "$url" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tar.gz
          gitleaks version

      - name: Scan the working tree and the history for secrets
        run: |
          set -euo pipefail
          gitleaks dir . --redact --verbose --exit-code 1
          gitleaks git . --redact --verbose --exit-code 1

      - name: Assert no Secret object and no inline credential
        run: |
          set -euo pipefail
          # THIS CHECK PARSES OBJECTS; IT DOES NOT SEARCH FOR TEXT.
          #
          # A text search for `secretRef` cannot express this invariant, and the first version
          # of this step proved it by failing on three things that are all correct:
          #
          #   - the vendored Flux CRDs, whose OpenAPI schemas *define* `secretRef` as an
          #     available field and whose CEL rules name it. That is Flux's API surface; it
          #     exists whether or not anything sets it, and it cannot be removed;
          #   - a comment in `gitrepository.yaml` stating that there is no `secretRef`;
          #   - a line in a README stating the same.
          #
          # A gate that fails on prose asserting the invariant holds is not enforcing the
          # invariant. What matters is structural: no object may BE a Secret, and no object we
          # author may SET `spec.secretRef`. That is what is checked below.
          python3 - <<'PY'
          import pathlib
          import sys

          import yaml

          roots = [pathlib.Path(p) for p in ("rendered", "apps", "clusters") if pathlib.Path(p).is_dir()]
          files = sorted({f for r in roots for pat in ("*.yaml", "*.yml") for f in r.rglob(pat)})

          violations = []
          objects = 0
          crds = 0


          def secret_refs(node, path):
              """Yield every dotted path at which a mapping key `secretRef` appears."""
              if isinstance(node, dict):
                  for k, v in node.items():
                      here = f"{path}.{k}"
                      if k == "secretRef":
                          yield here
                      yield from secret_refs(v, here)
              elif isinstance(node, list):
                  for i, v in enumerate(node):
                      yield from secret_refs(v, f"{path}[{i}]")


          for f in files:
              try:
                  docs = list(yaml.safe_load_all(f.read_text()))
              except yaml.YAMLError as exc:
                  violations.append(f"{f}: unparseable ({exc.__class__.__name__})")
                  continue
              for d in docs:
                  if not isinstance(d, dict) or not d.get("kind"):
                      continue
                  objects += 1
                  kind = d["kind"]
                  name = (d.get("metadata") or {}).get("name", "<unnamed>")

                  if kind == "Secret":
                      violations.append(f"{f}: a Secret object is present ({name})")

                  # A CustomResourceDefinition describes fields; it does not use them. Its
                  # schema legitimately names `secretRef`. Every other object is an instance,
                  # and an instance that sets `secretRef` is naming a credential.
                  if kind == "CustomResourceDefinition":
                      crds += 1
                      continue

                  for hit in secret_refs(d.get("spec"), "spec"):
                      violations.append(f"{f}: {kind}/{name} sets {hit}")

          if violations:
              for v in violations:
                  print(f"::error::{v}")
              sys.exit(f"{len(violations)} credential reference(s) found")

          if objects == 0:
              sys.exit("no objects were parsed; this check would pass vacuously")

          print(f"{objects} objects across {len(files)} files: no Secret object, and no "
                f"instance sets spec.secretRef ({crds} CRDs skipped, which define the field "
                f"rather than use it)")
          PY

      - name: Upload the rendered manifests
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rendered-manifests
          path: rendered/
          retention-days: 30
          if-no-files-found: error
