---
# RoleBinding, not ClusterRoleBinding. A RoleBinding grants its Role only within its own
# namespace, so even though the subject lives in `flux-system`, its authority stops at the
# boundary of `renvor-site-staging`.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: renvor-reconciler
  namespace: renvor-site-staging
  labels:
    app.kubernetes.io/name: renvor-reconciler
    app.kubernetes.io/part-of: renvor
    app.kubernetes.io/managed-by: bootstrap
subjects:
  - kind: ServiceAccount
    name: renvor-reconciler
    namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: renvor-reconciler
---
apiVersion: rbac.authorization.k8s.io/v1
