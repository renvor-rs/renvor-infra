---
# The identity every repository-driven apply runs as.
#
# It has no token mounted anywhere and is never used by a Pod. It exists only to be
# impersonated by `kustomize-controller`, which is why it needs no `imagePullSecrets` and no
# `automountServiceAccountToken` setting — nothing runs as it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: renvor-reconciler
  namespace: flux-system
  labels:
    app.kubernetes.io/name: renvor-reconciler
    app.kubernetes.io/part-of: renvor
    app.kubernetes.io/managed-by: bootstrap
---
# THE COMPLETE AUTHORITY OF REPOSITORY-DRIVEN RECONCILIATION, staging.
#
# Every resource type below appears in `apps/renvor-site/overlays/staging`, and every resource
# type in that overlay appears below — for THIS overlay specifically, not for the union of both.
# CI derives the requirement per namespace from the rendered output and compares it in both
# directions, so a grant this environment does not need fails the build.
#
# READ-ONLY, AND REQUIRED BY `wait: true` RATHER THAN BY ANY MANIFEST:
#   - `pods`, `replicasets` — **get/list/watch only**.
#
#     An earlier version of this file omitted these, with the comment "created by the
#     Deployment controller, not by an apply". That is true of the apply path and false of the
#     wait path, and the wait path is the one that decides whether a deployment is Ready.
#
#     When a Kustomization sets `spec.serviceAccountName`, kustomize-controller builds *both*
#     its client and its kstatus StatusPoller from the impersonated config — so health checks
#     run as this ServiceAccount, not as the controller. kstatus's Deployment reader does not
#     read the Deployment alone: it resolves the generated ReplicaSets, and through them the
#     Pods, with a namespaced LIST. A `forbidden` on that LIST is turned into an **Unknown**
#     status carrying the error, so the resource never computes as Current, the Kustomization
#     never reports Ready, it times out, and production — which `dependsOn` staging — never
#     reconciles at all.
#
#     Verified in the pinned image: `statusreaders.deploymentResourceReader`,
#     `NewReplicaSetStatusReader`, `podControllerStatusReader` and `ListNamespaceScoped` are
#     all present in the shipped `kustomize-controller` binary, as is the
#     `system:serviceaccount:%s:%s` impersonation format.
#
#     No write verb is granted on either. The reconciler still cannot create a Pod, which is
#     what keeps "it can only run what a Deployment schedules" true.
#
# DELIBERATELY ABSENT, each because nothing needs it:
#   - `secrets` — in any verb. TLS keypairs and ACME account keys exist at runtime, but
#     cert-manager creates them under cert-manager's own identity. The reconciler never reads,
#     writes, or lists a Secret, so a compromised commit cannot exfiltrate one.
#   - `configmaps` — no application configuration exists; the server's config is in the image.
#   - `namespaces` — the boundary is above this Role, not inside it.
#   - `roles`, `rolebindings`, `clusterroles`, `clusterrolebindings` — a reconciler that can
#     grant permissions can grant itself more of them.
#   - `events` — emitted by kustomize-controller under its own identity, not the impersonated
#     one. Confirmed: impersonation yields only the client and the status poller; the
#     EventRecorder belongs to the manager.
#   - every cluster-scoped resource, including `nodes` and `customresourcedefinitions`.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: renvor-reconciler
  namespace: renvor-site-staging
  labels:
    app.kubernetes.io/name: renvor-reconciler
    app.kubernetes.io/part-of: renvor
    app.kubernetes.io/managed-by: bootstrap
rules:
  # `delete` is required and is not an oversight: `prune: true` is what removes a resource when
  # it is deleted from Git, and without `delete` the pruning half of GitOps silently stops
  # working while reconciliation still reports success.
  - apiGroups: ['']
    resources: ['services', 'serviceaccounts', 'limitranges', 'resourcequotas']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
  - apiGroups: ['apps']
    resources: ['deployments']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
  - apiGroups: ['networking.k8s.io']
    resources: ['networkpolicies']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
  # NO cert-manager AND NO traefik.io HERE, DELIBERATELY.
  #
  # The staging overlay renders neither, and staging has no hostname by design. Granting them
  # anyway would let a staging manifest create an IngressRoute — and because Traefik routes
  # cluster-globally, a staging route claiming `Host(`renvor.dev`)` would contend with
  # production for real traffic. CI therefore assigns an empty hostname set to each staging
  # namespace and rejects any route or Certificate it tries to add.
  #
  # These two Roles are therefore NOT copies of each other. Production has four resource types
  # staging does not, because production renders four kinds staging does not.
  #
  # Read-only, for `wait: true` health assessment only. No create, no delete — the reconciler
  # cannot make a Pod, only observe the ones a Deployment produced.
  - apiGroups: ['apps']
    resources: ['replicasets']
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['']
    resources: ['pods']
    verbs: ['get', 'list', 'watch']
---
# Production adds only the cert-manager and Traefik resource types its overlay renders. The
# checker derives each namespace's required grants from that namespace's rendered overlay and
# refuses both missing and surplus authority.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: renvor-reconciler
  namespace: renvor-site
  labels:
    app.kubernetes.io/name: renvor-reconciler
    app.kubernetes.io/part-of: renvor
    app.kubernetes.io/managed-by: bootstrap
rules:
  - apiGroups: ['']
    resources: ['services', 'serviceaccounts', 'limitranges', 'resourcequotas']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
  - apiGroups: ['apps']
    resources: ['deployments']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
  - apiGroups: ['networking.k8s.io']
    resources: ['networkpolicies']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
  - apiGroups: ['cert-manager.io']
    resources: ['certificates', 'issuers']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
  - apiGroups: ['traefik.io']
    resources: ['ingressroutes', 'middlewares']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
  # Read-only, for `wait: true` health assessment only. No create, no delete — the reconciler
  # cannot make a Pod, only observe the ones a Deployment produced.
  - apiGroups: ['apps']
    resources: ['replicasets']
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['']
    resources: ['pods']
    verbs: ['get', 'list', 'watch']
---
