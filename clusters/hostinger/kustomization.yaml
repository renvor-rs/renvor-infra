# The Flux control plane. APPLIED BY HAND — Flux reconciles none of this.
#
#   kubectl apply --server-side -k clusters/hostinger/
#
# It holds the source definition and the four Kustomizations, and nothing else. In particular it
# does NOT include `flux-system/` — the controllers and the tenancy boundary are a separate
# hand-applied bootstrap, so a bad commit cannot take down the thing that would have to apply
# the fix.
#
# NOTHING HERE IS RECONCILED, and that is the point. `/clusters` is excluded from the artifact
# the GitRepository fetches (see `gitrepository.yaml`), so these objects are not merely
# unreconciled — they are absent from the bytes Flux downloads. A commit to the public
# repository therefore cannot edit the objects that constrain commits to the public repository:
# it cannot raise its own `serviceAccountName`, widen its own `targetNamespace`, or repoint the
# source.
#
# The cost is that changes here take effect only when a human applies them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - gitrepository.yaml
  - staging.yaml
  - production.yaml
  - docs-staging.yaml
  - docs-production.yaml
