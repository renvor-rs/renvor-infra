# Production reconciliation.
#
# `dependsOn` is the load-bearing line: production does not reconcile until staging is Ready.
# Because staging's `wait: true` and `healthChecks` mean Ready implies "the Deployment is
# actually Available", a digest that cannot start never reaches production — the ordering is
# enforced by the controller rather than by a human remembering the sequence.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: renvor-site-production
  namespace: flux-system
spec:
  dependsOn:
    - name: renvor-site-staging

  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: renvor-infra
  path: ./apps/renvor-site/overlays/production

  prune: true
  wait: true

  # THE CERTIFICATE GATE IS A CEL EXPRESSION, NOT A `healthChecks` ENTRY, AND BOTH REASONS
  # MATTER.
  #
  # 1. `healthChecks` is dead configuration here. The vendored CRD says so in this repository's
  #    own bytes — `flux-system/flux-system.yaml`, the `wait` property: *"Wait instructs the
  #    controller to check the health of all the reconciled resources. When enabled, the
  #    HealthChecks are ignored."* `wait: true` is set below, so every `healthChecks` entry was
  #    being silently discarded.
  #
  # 2. `wait: true` alone does NOT gate on the certificate being issued. kstatus has no
  #    cert-manager-aware status reader — the string `cert-manager.io` appears zero times in
  #    the pinned `kustomize-controller` binary — so a Certificate falls through to the generic
  #    reader, which checks `deletionTimestamp`, `observedGeneration`, and the standard
  #    `Reconciling`/`Stalled` conditions. A Certificate sitting at `Ready: False` matches none
  #    of those and computes as **Current**.
  #
  # Together those meant this gate failed OPEN in exactly the way the old comment claimed it
  # prevented: the Kustomization would report Ready while `renvor.dev` served Traefik's default
  # self-signed certificate — "deployed" and untrustable, the worst of both states.
  #
  # `healthCheckExprs` is evaluated by cel-go, which IS linked into this build, and asserts the
  # condition that actually means "issued".
  healthCheckExprs:
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      current: "status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')"

  targetNamespace: renvor-site

  # Same restricted identity as staging — see `staging.yaml` for the full reasoning. Production
  # must not be the environment that reconciles with more authority.
  serviceAccountName: renvor-reconciler

  force: false
