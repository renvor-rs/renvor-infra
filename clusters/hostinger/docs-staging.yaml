apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: renvor-docs-staging
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef: { kind: GitRepository, name: renvor-infra }
  path: ./apps/renvor-docs/overlays/staging
  prune: true
  wait: true
  targetNamespace: renvor-docs-staging
  serviceAccountName: renvor-reconciler
  force: false
