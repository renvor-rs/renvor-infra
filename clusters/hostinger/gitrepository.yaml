# The one source Flux is allowed to read.
#
# **Public HTTPS, and no credential.** There is no `secretRef`, no deploy key, and no personal
# access token — `renvor-rs/renvor-infra` is a public repository, so anonymous read is enough.
# That is a deliberate design constraint rather than a convenience: a credential that does not
# exist cannot leak, cannot expire unnoticed, and does not need a rotation schedule. It also
# means this cluster holds no GitHub identity at all.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: renvor-infra
  namespace: flux-system
spec:
  interval: 5m
  url: https://github.com/renvor-rs/renvor-infra
  ref:
    # A branch, not a tag or a commit. `main` is protected by an active ruleset requiring a
    # pull request, signed commits, linear history, and conversation resolution, with zero
    # bypass actors — so "what is on main" is already a reviewed artifact, and following it is
    # following the review.
    branch: main
  # Fetch only what is needed to read the tree. No submodules: this repository has none, and
  # enabling them would let a future submodule pull in code from a source nobody reviewed here.
  ignore: |
    # Exclude everything, then re-include only what the cluster reconciles. An allow-list means
    # a new top-level directory arrives ignored rather than arriving live.
    /*
    !/apps
  timeout: 60s
# `/clusters` IS DELIBERATELY NOT RE-INCLUDED, AND THAT IS A SECURITY BOUNDARY.
#
# This directory holds the Flux control plane: this GitRepository, both Kustomizations, and the
# tenancy bootstrap that constrains them. Those objects are applied by hand from a reviewed
# commit and are never reconciled.
#
# If `/clusters` were in the fetched artifact, a commit to the public repository could edit the
# very objects that limit what a commit to the public repository may do — raise its own
# `serviceAccountName`, widen its own `targetNamespace`, or point the source somewhere else.
# Excluding it means the control plane is not merely *unreconciled* but **absent from the bytes
# Flux downloads**, so there is nothing to reconcile even by mistake.
#
# The cost is real and worth stating: changes under `/clusters` do not take effect until
# someone applies them by hand. That is the intended trade — the control plane should not be
# self-modifying.
