apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: renvor-docs-allow-acme-solver
  labels: { app.kubernetes.io/name: renvor-docs, app.kubernetes.io/part-of: renvor, app.kubernetes.io/managed-by: flux }
spec:
  podSelector:
    matchLabels: { acme.cert-manager.io/http01-solver: 'true' }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { app.kubernetes.io/name: traefik }
      ports:
        - { protocol: TCP, port: 8089 }
