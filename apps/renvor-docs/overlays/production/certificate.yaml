apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: docs-renvor-dev-tls
  namespace: renvor-docs
  labels: { app.kubernetes.io/name: renvor-docs, app.kubernetes.io/part-of: renvor, app.kubernetes.io/managed-by: flux }
spec:
  secretName: docs-renvor-dev-tls
  commonName: docs.renvor.dev
  dnsNames: [docs.renvor.dev]
  # The staging-directory rehearsal reached Ready=True and served its certificate on the wire
  # before this promotion. Changing issuerRef made cert-manager reissue in place without deleting
  # the certificate Secret or interrupting TLS; see docs/runbooks/certificates.md.
  issuerRef: { name: letsencrypt-prod, kind: Issuer }
  privateKey: { algorithm: ECDSA, size: 256, rotationPolicy: Always }
  duration: 2160h
  renewBefore: 720h
