# The landing site.
#
# A `scratch` image holding a static export, a static binary, and a generated config file. It
# reads no configuration at runtime, writes nothing, and talks to nothing. Every setting below
# either enforces one of those facts or makes its violation visible.
#
# RESOURCE FIGURES ARE MEASURED, NOT ESTIMATED. Taken from the built image on 2026-08-17:
# 9.1 MiB resident at idle, 20.6 MiB under 200 concurrent requests across HTML, chunks, and the
# 34 KB brand PNGs, settling to 19.3 MiB. CPU was below measurement resolution throughout.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: renvor-site
  labels:
    app.kubernetes.io/name: renvor-site
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: renvor
    app.kubernetes.io/managed-by: flux
spec:
  # Two replicas on a single-node cluster.
  #
  # Not for node-failure tolerance — one node cannot provide that, and claiming otherwise would
  # be the kind of statement this project exists not to make. Two replicas buy exactly one
  # thing, and it is worth having: a rolling update to a new digest keeps serving from the old
  # pod while the new one starts and passes its readiness probe, so a deploy is not a gap.
  replicas: 2

  revisionHistoryLimit: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below the current count while updating, and add at most one pod at a time.
      # On a single node this is what makes a digest change invisible to a reader.
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: renvor-site

  template:
    metadata:
      labels:
        app.kubernetes.io/name: renvor-site
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: renvor
    spec:
      serviceAccountName: renvor-site

      # The pod-level setting is the one that takes effect. The workload makes no API call, so
      # a mounted token would be a credential with no purpose and a real cost if the container
      # were compromised.
      automountServiceAccountToken: false

      # No host namespaces. Stated explicitly rather than left to defaults, so that a reviewer
      # can see the answer instead of having to know it.
      hostNetwork: false
      hostPID: false
      hostIPC: false

      # A static server has nothing to flush. Five seconds is enough for in-flight responses to
      # complete and keeps a rolling update brisk.
      terminationGracePeriodSeconds: 5

      # Spread across nodes where more than one exists. `ScheduleAnyway` is deliberate: on the
      # current single-node cluster a `DoNotSchedule` constraint would leave the second replica
      # permanently Pending, which is a self-inflicted outage rather than a safety property.
      # This costs nothing today and starts working the day a second node appears.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: renvor-site

      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: server
          # Set by each overlay to an immutable digest. There is no tag here and there must
          # never be one: a tag can be repointed, which would let the running content change
          # without a commit. `kustomize build` fails if an overlay forgets to supply it.
          image: ghcr.io/renvor-rs/renvor-site

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ['ALL']
            seccompProfile:
              type: RuntimeDefault

          resources:
            requests:
              cpu: 10m
              memory: 32Mi
              # THE EPHEMERAL-STORAGE REQUEST IS THE IMPORTANT ONE, and it is here because of
              # something measured on this specific cluster rather than because a checklist
              # asks for it.
              #
              # This node has evicted **524 pods** with `The node had condition: [DiskPressure]`,
              # and the eviction messages name the reason: `request is 0`. Not one existing
              # workload declares an ephemeral-storage request, so the kubelet ranks them all as
              # best-effort for that resource and evicts them first when the disk fills.
              #
              # Declaring a request puts this pod above that tier. It is a modest ask — the
              # image is 4.1 MB and the server writes nothing — and it buys eviction protection
              # that nothing else on the node currently has.
              ephemeral-storage: 64Mi
            limits:
              # ~20x measured idle CPU. The server is I/O bound and never approaches this; the
              # limit exists to stop a pathological request pattern starving its neighbours.
              cpu: 200m
              # ~4.7x the measured peak of 20.6 MiB. Generous enough that a traffic spike does
              # not OOM, tight enough that a leak becomes visible as a restart rather than as a
              # slow squeeze on everything else running here.
              memory: 96Mi
              ephemeral-storage: 256Mi

          # Three probes with three different jobs.
          #
          # `/health` is served by static-web-server itself (`health = true` in the generated
          # config): 200, no log line, no filesystem access. All three hit it, because for a
          # static server "can it answer HTTP" genuinely is the whole question.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            # 30 x 2s = 60s to come up. The binary starts in well under a second; this is
            # headroom for a cold image pull, and it is what keeps the liveness probe from
            # killing a pod that is merely still starting.
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            # Leave the Service endpoints quickly if the pod stops answering — this is what
            # makes `maxUnavailable: 0` mean something during a rolling update.
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            # Deliberately slower and more forgiving than readiness. Restarting is a bigger
            # hammer than removing from the load balancer, so it should need more evidence.
            failureThreshold: 4

          # No volumes at all, which is why `readOnlyRootFilesystem: true` needs no companion
          # `emptyDir` for a temp path: static-web-server writes nothing, verified by running
          # the image with `--read-only` and no tmpfs in CI. No ConfigMap and no Secret either
          # — the config file is baked into the image at build time, from the same build that
          # produced the content it describes.
