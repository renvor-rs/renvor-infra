# A dedicated ServiceAccount that can do nothing.
#
# The workload is a static file server. It makes no Kubernetes API call, so it needs no token —
# and a token it does not need is a credential an attacker could use if the container were ever
# compromised. `automountServiceAccountToken: false` is set here AND on the Deployment's pod
# spec, because the pod-level setting is the one that actually takes effect if the two ever
# disagree, and stating it twice makes the intent unmistakable to a reader of either file.
#
# It also exists so the workload is not using `default`. The default ServiceAccount in a
# namespace is shared by anything that forgets to name one, which makes "what can this identity
# do" an unanswerable question the moment a second workload appears.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: renvor-site
  labels:
    app.kubernetes.io/name: renvor-site
    app.kubernetes.io/part-of: renvor
    app.kubernetes.io/managed-by: flux
automountServiceAccountToken: false
