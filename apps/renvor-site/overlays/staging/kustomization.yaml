# Staging: the same image, the same security settings, no way in from the internet.
#
# The point of this environment is to answer one question — does the exact digest that is about
# to go to production actually run on this cluster — without that digest being reachable by
# anyone. So it deliberately has NO Ingress, NO Certificate, and NO hostname. Validation is
# done through a temporary `kubectl port-forward`, which requires cluster credentials and
# leaves nothing behind.
#
# It is not a smaller or looser copy of production. Same base, same NetworkPolicy, same
# non-root read-only container, same digest. The only differences are the namespace, one fewer
# replica, and the absence of anything that would expose it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: renvor-site-staging

# NO Namespace RESOURCE HERE, DELIBERATELY.
#
# `renvor-site-staging` is created by the hand-applied bootstrap in
# `clusters/hostinger/flux-system/renvor-tenancy.yaml`, together with the Role and RoleBinding
# that constrain this overlay. Reconciliation runs as `flux-system/renvor-reconciler`, which
# holds no authority over namespaces at all — it cannot create one, relabel one, or prune one.
#
# That is the point: the overlay reconciles strictly *inside* a boundary it has no power to
# move. If this resource were restored here, reconciliation would fail closed with a
# permissions error rather than quietly regaining control of its own walls.
resources:
  - ../../base

# The digest is the deployment. `newTag` is deliberately absent and must stay absent: a tag can
# be repointed at different content, which would let what is running change without a commit.
# This value is written by the promotion procedure in docs/runbooks/, never by hand from
# memory.
images:
  - name: ghcr.io/renvor-rs/renvor-site
    digest: sha256:649394aaef1ea1334417f86e471cc0f660eb178d417022bbdca01f47cddff11b

patches:
  # One replica. Staging exists to prove the image runs, and a second copy proves nothing
  # further while consuming a share of a shared node.
  - target:
      kind: Deployment
      name: renvor-site
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/instance: renvor-site-staging
      renvor.dev/environment: staging
