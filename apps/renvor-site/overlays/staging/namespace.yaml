apiVersion: v1
kind: Namespace
metadata:
  name: renvor-site-staging
  labels:
    app.kubernetes.io/name: renvor-site
    app.kubernetes.io/part-of: renvor
    app.kubernetes.io/managed-by: flux
    renvor.dev/environment: staging
    # Pod Security Admission, enforced rather than audited.
    #
    # `restricted` is the strictest built-in profile: it requires runAsNonRoot, forbids
    # privilege escalation and all capabilities, and demands a seccomp profile. The workload
    # already satisfies every one of those in its own securityContext — this makes the
    # admission controller check it, so a future edit that quietly drops one is rejected at
    # creation rather than discovered in a review that might not happen.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    renvor.dev/purpose: >-
      Pre-production validation of the exact image digest bound for renvor.dev. Deliberately has
      no Ingress and no public hostname; reached only through a temporary port-forward.
