# Production: the same base, the same digest staging proved, plus the parts that expose it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: renvor-site

# NO Namespace RESOURCE HERE, DELIBERATELY — see the staging overlay for the full reasoning.
# `renvor-site` is created by the hand-applied bootstrap alongside the Role and RoleBinding
# that constrain this overlay, and the reconciler holds no namespace authority whatsoever.
resources:
  - ../../base
  - issuer.yaml
  - certificate.yaml
  - middleware.yaml
  - networkpolicy-acme.yaml
  - ingress.yaml

# THE SAME DIGEST STAGING RAN. Promotion is copying this value across, never rebuilding — a
# rebuild produces a different digest, which means production would run something no staging
# environment ever saw. No tag, ever.
images:
  - name: ghcr.io/renvor-rs/renvor-site
    digest: sha256:649394aaef1ea1334417f86e471cc0f660eb178d417022bbdca01f47cddff11b

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/instance: renvor-site-production
      renvor.dev/environment: production
