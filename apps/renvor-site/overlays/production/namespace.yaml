apiVersion: v1
kind: Namespace
metadata:
  name: renvor-site
  labels:
    app.kubernetes.io/name: renvor-site
    app.kubernetes.io/part-of: renvor
    app.kubernetes.io/managed-by: flux
    renvor.dev/environment: production
    # Same enforced `restricted` profile as staging. Production must not be the environment
    # with the weaker admission policy.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    renvor.dev/purpose: 'Serves https://renvor.dev and the www redirect.'
